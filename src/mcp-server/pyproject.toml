[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iauto-mcp-server"
version = "0.1.0"
description = "MCP server for Power Platform to Azure intelligent automation migration assessment."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Intelligent Automation TTT" }]
keywords = ["azure", "mcp", "power-platform", "migration", "intelligent-automation"]
dependencies = [
  "iauto-discovery",
  "iauto-inference",
  "mcp>=1.27,<2",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.14,<1",
]

[project.scripts]
iauto-mcp = "iauto_mcp.server:main"

[tool.uv.sources]
iauto-inference = { path = "../inference/python", editable = true }
iauto-discovery = { path = "../../tools/discovery", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["iauto_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["iauto_mcp", "tests"]

[tool.ruff.lint]
# Broad, opinionated rule set so code smells surface as lint failures (telemetry on quality).
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF", "ASYNC", "S", "PL"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "E501"]   # asserts, magic values, long CSV fixtures

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.bandit]
exclude_dirs = ["tests"]
